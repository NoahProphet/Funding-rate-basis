[project]
name = "basis-bot"
version = "0.1.0"
description = "Delta-neutral funding-rate basis bot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "structlog>=25.4",
]

[project.scripts]
basis-bot = "basis_bot.core.entry:main"

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basis_bot"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Preview only for explicitly selected rules: PLR1702 enforces the
# spec's maximum nesting depth of 3.
preview = true
explicit-preview-rules = true
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "C90",
    "DTZ",  # naive datetimes; everything must be UTC-aware
    "RUF", "PT", "PLR1702",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
# Strict everywhere is a superset of the spec's strict-for-money-path rule
# and avoids per-module flag lists that drift.
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
